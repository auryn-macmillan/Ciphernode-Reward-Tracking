name: refresh-rewards-state

on:
  schedule:
    # 06:17, 14:17 and 22:17 UTC — three refreshes per day
    - cron: '17 6,14,22 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recompute accrual from chain
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node tools/track.mjs

      - name: Pin settlement sheets + state to IPFS (Pinata)
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_USER: ${{ secrets.PINATA_API_USER }}
        run: node tools/pin.mjs

      - name: Commit state + payout payloads + pinnings
        run: |
          git config user.name "rewards-tracker[bot]"
          git config user.email "rewards-tracker[bot]@users.noreply.github.com"
          git add state.json payouts/ pinnings.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: refresh accrual ($(date -u +%FT%TZ))"
            git push
          fi